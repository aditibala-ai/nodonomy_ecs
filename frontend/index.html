<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nodonomy — monitoring dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --border: #262c36;
    --text: #e6edf3;
    --text-dim: #8b949e;
    --teal: #2dd4bf;
    --amber: #f2a900;
    --red: #e5484d;
    --mono: 'IBM Plex Mono', 'Courier New', monospace;
    --sans: -apple-system, 'Segoe UI', Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: var(--sans); font-size: 14px;
  }
  .mono { font-family: var(--mono); }

  /* ---------- Login ---------- */
  #login-view {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
  }
  .login-card {
    width: 320px; padding: 32px; background: var(--surface);
    border: 1px solid var(--border); border-radius: 6px;
  }
  .login-card h1 { font-size: 18px; margin: 0 0 4px; }
  .login-card p { color: var(--text-dim); font-size: 13px; margin: 0 0 24px; }
  label { display: block; font-size: 12px; color: var(--text-dim); margin: 14px 0 6px; }
  input {
    width: 100%; padding: 9px 10px; background: #0d1117; border: 1px solid var(--border);
    border-radius: 4px; color: var(--text); font-family: var(--sans); font-size: 14px;
  }
  input:focus { outline: none; border-color: var(--teal); }
  button {
    cursor: pointer; border: none; border-radius: 4px; font-family: var(--sans);
    font-size: 14px; font-weight: 500;
  }
  .btn-primary {
    width: 100%; margin-top: 20px; padding: 10px; background: var(--teal); color: #04342c;
  }
  .btn-primary:hover { opacity: 0.9; }
  #login-error { color: var(--red); font-size: 12px; margin-top: 10px; min-height: 16px; }

  /* ---------- App shell ---------- */
  #app-view { display: none; min-height: 100vh; grid-template-columns: 220px 1fr; }
  #app-view.active { display: grid; }
  aside {
    background: var(--surface); border-right: 1px solid var(--border);
    padding: 20px 0; display: flex; flex-direction: column;
  }
  .brand { padding: 0 20px 20px; font-weight: 600; font-size: 15px; border-bottom: 1px solid var(--border); }
  .brand span { color: var(--teal); }
  .node-list { flex: 1; overflow-y: auto; padding: 12px 0; }
  .node-item {
    padding: 10px 20px; cursor: pointer; border-left: 2px solid transparent;
    display: flex; justify-content: space-between; align-items: center;
  }
  .node-item:hover { background: #1c2230; }
  .node-item.selected { border-left-color: var(--teal); background: #1c2230; }
  .node-item .id { font-family: var(--mono); font-size: 13px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .dot.online { background: var(--teal); }
  .dot.offline { background: var(--red); }
  .logout-btn { margin: 12px 20px 0; padding: 8px; background: transparent; border: 1px solid var(--border); color: var(--text-dim); }
  .logout-btn:hover { color: var(--text); border-color: var(--text-dim); }

  main { padding: 24px 32px; overflow-y: auto; }
  .topbar { display: flex; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }
  .stat-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
    padding: 14px 18px; min-width: 130px;
  }
  .stat-card .label { font-size: 11px; color: var(--text-dim); margin-bottom: 6px; }
  .stat-card .value { font-family: var(--mono); font-size: 22px; }
  .stat-card .value.teal { color: var(--teal); }
  .stat-card .value.red { color: var(--red); }

  .panel {
    background: var(--surface); border: 1px solid var(--border); border-radius: 6px;
    padding: 18px 20px; margin-bottom: 20px;
  }
  .panel h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-dim); margin: 0 0 16px; font-weight: 500; }
  .telemetry-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 14px; }
  .telemetry-cell .label { font-size: 11px; color: var(--text-dim); }
  .telemetry-cell .value { font-family: var(--mono); font-size: 18px; margin-top: 4px; }
  .telemetry-cell .value.flag { color: var(--amber); }

  .alert-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 13px;
  }
  .alert-row:last-child { border-bottom: none; }
  .sev { font-size: 11px; padding: 2px 8px; border-radius: 3px; font-family: var(--mono); }
  .sev.high { background: rgba(229,72,77,0.15); color: var(--red); }
  .sev.medium { background: rgba(242,169,0,0.15); color: var(--amber); }
  .sev.low { background: rgba(45,212,191,0.15); color: var(--teal); }
  .alert-actions button {
    padding: 4px 10px; margin-left: 6px; background: transparent; border: 1px solid var(--border);
    color: var(--text-dim); font-size: 11px; border-radius: 3px;
  }
  .alert-actions button:hover { color: var(--text); }
  .empty-state { color: var(--text-dim); font-size: 13px; padding: 8px 0; }
  #chart-container { height: 220px; }
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="login-view">
  <div class="login-card">
    <h1>Nodonomy</h1>
    <p>Environmental monitoring dashboard</p>
    <form id="login-form">
      <label for="username">Username</label>
      <input id="username" type="text" autocomplete="username" required>
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <button type="submit" class="btn-primary">Sign in</button>
      <div id="login-error"></div>
    </form>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app-view">
  <aside>
    <div class="brand"><span>●</span> Nodonomy</div>
    <div class="node-list" id="node-list"></div>
    <button class="logout-btn" id="logout-btn">Log out</button>
  </aside>

  <main>
    <div class="topbar" id="system-overview"></div>

    <div class="panel">
      <h2>Live telemetry — <span id="selected-node-label" class="mono">no node selected</span></h2>
      <div id="telemetry-content" class="telemetry-grid">
        <div class="empty-state">Select a node from the sidebar to view its latest readings.</div>
      </div>
    </div>

    <div class="panel">
      <h2>Historical temperature</h2>
      <div id="chart-container"><canvas id="history-chart"></canvas></div>
    </div>

    <div class="panel">
      <h2>Alerts</h2>
      <div id="alerts-content"></div>
    </div>
  </main>
</div>

<script>
const API_BASE = 'http://localhost:8000';
let token = localStorage.getItem('nodonomy_token');
let selectedNode = null;
let historyChart = null;
let pollHandle = null;

// ---------- Auth ----------
document.getElementById('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  const errEl = document.getElementById('login-error');
  errEl.textContent = '';

  try {
    const res = await fetch(`${API_BASE}/auth/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      throw new Error(body.detail || 'Invalid username or password');
    }
    const data = await res.json();
    token = data.access_token;
    localStorage.setItem('nodonomy_token', token);
    enterApp();
  } catch (err) {
    errEl.textContent = err.message;
  }
});

document.getElementById('logout-btn').addEventListener('click', () => {
  localStorage.removeItem('nodonomy_token');
  token = null;
  clearInterval(pollHandle);
  document.getElementById('app-view').classList.remove('active');
  document.getElementById('login-view').style.display = 'flex';
});

async function authedFetch(path, options = {}) {
  const res = await fetch(`${API_BASE}${path}`, {
    ...options,
    headers: { ...(options.headers || {}), 'Authorization': `Bearer ${token}` }
  });
  if (res.status === 401) {
    localStorage.removeItem('nodonomy_token');
    token = null;
    document.getElementById('app-view').classList.remove('active');
    document.getElementById('login-view').style.display = 'flex';
    document.getElementById('login-error').textContent = 'Session expired — please sign in again.';
    throw new Error('unauthorized');
  }
  return res;
}

function enterApp() {
  document.getElementById('login-view').style.display = 'none';
  document.getElementById('app-view').classList.add('active');
  refreshAll();
  pollHandle = setInterval(refreshAll, 5000); // auto-refresh, per spec 5.5
}

// ---------- Data refresh ----------
async function refreshAll() {
  try {
    await Promise.all([loadSystemStatus(), loadNodes(), loadAlerts()]);
    if (selectedNode) await loadNodeDetail(selectedNode);
  } catch (e) { /* authedFetch already handles session expiry */ }
}

async function loadSystemStatus() {
  const res = await authedFetch('/system/status');
  const s = await res.json();
  document.getElementById('system-overview').innerHTML = `
    <div class="stat-card"><div class="label">Total nodes</div><div class="value">${s.total_nodes}</div></div>
    <div class="stat-card"><div class="label">Online</div><div class="value teal">${s.online_nodes}</div></div>
    <div class="stat-card"><div class="label">Offline</div><div class="value red">${s.offline_nodes}</div></div>
    <div class="stat-card"><div class="label">Active alerts</div><div class="value ${s.active_alerts > 0 ? 'red' : ''}">${s.active_alerts}</div></div>
  `;
}

async function loadNodes() {
  const res = await authedFetch('/nodes');
  const nodes = await res.json();
  const list = document.getElementById('node-list');

  if (nodes.length === 0) {
    list.innerHTML = '<div class="empty-state" style="padding:10px 20px">No nodes registered yet. Start the simulator.</div>';
    return;
  }
  if (!selectedNode) selectedNode = nodes[0].node_id;

  list.innerHTML = nodes.map(n => `
    <div class="node-item ${n.node_id === selectedNode ? 'selected' : ''}" data-node="${n.node_id}">
      <span class="id">${n.node_id}</span>
      <span class="dot ${n.status}"></span>
    </div>
  `).join('');

  list.querySelectorAll('.node-item').forEach(el => {
    el.addEventListener('click', () => {
      selectedNode = el.dataset.node;
      document.querySelectorAll('.node-item').forEach(x => x.classList.remove('selected'));
      el.classList.add('selected');
      loadNodeDetail(selectedNode);
    });
  });
}

async function loadNodeDetail(nodeId) {
  document.getElementById('selected-node-label').textContent = nodeId;

  try {
    const res = await authedFetch(`/telemetry/latest/${nodeId}`);
    if (res.ok) {
      const t = await res.json();
      document.getElementById('telemetry-content').innerHTML = `
        <div class="telemetry-cell"><div class="label">Temperature</div><div class="value">${t.temperature ?? '—'} °C</div></div>
        <div class="telemetry-cell"><div class="label">Sound level</div><div class="value">${t.sound_level ?? '—'} dB</div></div>
        <div class="telemetry-cell"><div class="label">Vibration</div><div class="value ${t.vibration ? 'flag' : ''}">${t.vibration ? 'Active' : 'None'}</div></div>
        <div class="telemetry-cell"><div class="label">Motion</div><div class="value ${t.motion ? 'flag' : ''}">${t.motion ? 'Detected' : 'None'}</div></div>
        <div class="telemetry-cell"><div class="label">Battery</div><div class="value">${t.battery ?? '—'}%</div></div>
        <div class="telemetry-cell"><div class="label">Last updated</div><div class="value" style="font-size:12px">${new Date(t.timestamp).toLocaleTimeString()}</div></div>
      `;
    } else {
      document.getElementById('telemetry-content').innerHTML = '<div class="empty-state">No telemetry received yet for this node.</div>';
    }
  } catch (e) { /* handled by authedFetch */ }

  try {
    const histRes = await authedFetch(`/telemetry/history/${nodeId}?limit=30`);
    const history = histRes.ok ? await histRes.json() : [];
    renderChart(history);
  } catch (e) { /* handled by authedFetch */ }
}

function renderChart(history) {
  const ctx = document.getElementById('history-chart');
  const labels = history.map(h => new Date(h.timestamp).toLocaleTimeString());
  const temps = history.map(h => h.temperature);

  if (historyChart) { historyChart.destroy(); }
  historyChart = new Chart(ctx, {
    type: 'line',
    data: {
      labels,
      datasets: [{
        label: 'Temperature (°C)',
        data: temps,
        borderColor: '#2dd4bf',
        backgroundColor: 'rgba(45,212,191,0.08)',
        fill: true,
        tension: 0.3,
        pointRadius: 2
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: false,
      scales: {
        x: { ticks: { color: '#8b949e', maxTicksLimit: 6 }, grid: { color: '#262c36' } },
        y: { ticks: { color: '#8b949e' }, grid: { color: '#262c36' } }
      },
      plugins: { legend: { labels: { color: '#8b949e' } } }
    }
  });
}

async function loadAlerts() {
  const res = await authedFetch('/alerts');
  const alerts = await res.json();
  const container = document.getElementById('alerts-content');

  if (alerts.length === 0) {
    container.innerHTML = '<div class="empty-state">No alerts recorded.</div>';
    return;
  }

  container.innerHTML = alerts.slice(0, 15).map(a => `
    <div class="alert-row">
      <div>
        <span class="sev ${a.severity}">${a.severity}</span>
        <span style="margin-left:10px" class="mono">${a.node_id}</span>
        <span style="margin-left:10px; color: var(--text-dim)">${a.event_type.replace(/_/g, ' ')}</span>
      </div>
      <div class="alert-actions">
        <span style="color: var(--text-dim); font-size: 12px; margin-right: 8px">${a.status}</span>
        ${a.status === 'active' ? `<button onclick="ackAlert(${a.id})">Acknowledge</button>` : ''}
        ${a.status !== 'resolved' ? `<button onclick="resolveAlert(${a.id})">Resolve</button>` : ''}
      </div>
    </div>
  `).join('');
}

async function ackAlert(id) {
  await authedFetch(`/alerts/${id}/acknowledge`, { method: 'POST' });
  loadAlerts();
}
async function resolveAlert(id) {
  await authedFetch(`/alerts/${id}/resolve`, { method: 'POST' });
  loadAlerts();
}

// ---------- Boot ----------
if (token) { enterApp(); } else { document.getElementById('login-view').style.display = 'flex'; }
</script>
</body>
</html>
